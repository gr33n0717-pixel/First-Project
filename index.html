<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <section>
        <nav>
            <img src="Images/FES.svg" class="logo" alt="Logo">
            <ul>
                <li><a href="#About">About</a></li>
                <li><a href="#Discord">Discord</a></li>
                <li><a href="#Contact">Contact</a></li>
            </ul>
        </nav>
        <header>
            <div class="row">
            <div class="home__description">
                <h1> Best Place to Learn Frontend</h1>
                <p class="subheader">Go from being a beginner to a pro with a simplified process</p>
                <button class="home__description--button">Start Now :D</button>
            </div>
            <figure>
                <img src="Images/laptop.png" alt="Home page image">
            </figure>
        </div>
        </header>
    </section>
    <main>
    <section id="about">
        <h2> About</h2>
        <div class="row">

        <div class="section__description">
        <div class="section__description--wrapper">
            <p class="section__description--para">Hello everyone!!! </p>
            <p class="section__description--para">Hello everyone!!! </p>
        </div>
        <figure class="about__image--wrapper"> 
            <img src="Images/about.jpg" alt="About page image">
        </figure>
        </div>
        </div>
    </section>

    <section id="discord">
    <h2>Discord</h2>
    <div class="row">

    <div class="section__description">
    <figure class="about__image--wrapper">
        <img src="Images/discord.png" alt="Discord page image">
    </figure>
    <div class="section__description--wrapper"> 
        <p class="section__description--para">Yo</p>
        <p class="section__description--para">Yo</p>
    </div>
    </div>
    </div>
</section>

    
    <section id="Contact">
        <h2>Contact</h2>
        <form action="#">
            <label>Email</label>
            <input type="email" placeholder="Your email here">
            <label>Message</label>
            <textarea type="text" placeholder="Start Typing Here"></textarea>
            <button>Contact Us :D</button>
        </form>
    </section>
</main>
<footer>
    <img class="footer__logo"src="Images/FES.svg" alt="Footer image">
    <div class="footer__links"> 
        <a class="footer__link" href="#about">About</a>
        <a class="footer__link" href="#Discord">Discord</a>
        <a class="footer__link" href="#Contact">Contact</a>
        <a class="footer__link" href="">Courses</a>
    </div>
    <p>Copyright Frontend Simplified</p>
</footer>
</body>
</html>
